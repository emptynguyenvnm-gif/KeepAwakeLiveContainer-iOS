
name: Build KeepAwake Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Build KeepAwake
        run: |
          make clean
          make

          mkdir -p dist

          find . -name "KeepAwake.dylib" \
            -not -path "./dist/*" \
            -exec cp {} dist/KeepAwake.dylib \;

          test -s dist/KeepAwake.dylib
          file dist/KeepAwake.dylib

      - name: Upload KeepAwake dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-iOS
          path: dist/KeepAwake.dylib
          if-no-files-found: error
