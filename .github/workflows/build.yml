name: Build KeepAwake

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (không ký sẵn)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation \
            -Wl,-no_adhoc_codesign \
            -install_name @rpath/KeepAwake.dylib \
            -o KeepAwake.dylib KeepAwake.m

      - name: Check dylib
        run: |
          lipo -info KeepAwake.dylib
          otool -L KeepAwake.dylib
          codesign -dv KeepAwake.dylib 2>&1 || true
          if otool -L KeepAwake.dylib | grep -qi substrate; then
            echo "Còn phụ thuộc Substrate!"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KeepAwake
          path: KeepAwake.dylib
