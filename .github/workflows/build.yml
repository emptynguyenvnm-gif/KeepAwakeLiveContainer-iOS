
name: Build KeepAwake Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Build KeepAwake
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building tweak ==="
          make clean
          make

          echo "=== Finding dylib ==="

          DYLIB=""

          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O.*dynamically linked shared library"; then
              DYLIB="$f"
              break
            fi
          done < <(find . -type f -name "KeepAwake.dylib" \
            -not -path "*/.theos/obj/*/*.dSYM/*" \
            -print0)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: Valid KeepAwake.dylib not found"
            exit 1
          fi

          mkdir -p dist
          cp "$DYLIB" dist/KeepAwake.dylib

          echo "=== Checking architecture ==="
          file dist/KeepAwake.dylib

          echo "=== Checking dependencies ==="
          otool -L dist/KeepAwake.dylib

          OLD="/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"
          NEW="@rpath/CydiaSubstrate.framework/CydiaSubstrate"

          if otool -L dist/KeepAwake.dylib | grep -Fq "$OLD"; then
            echo "=== Fixing CydiaSubstrate path ==="
            install_name_tool -change "$OLD" "$NEW" dist/KeepAwake.dylib
          fi

          echo "=== Final dependency check ==="
          otool -L dist/KeepAwake.dylib

          if otool -L dist/KeepAwake.dylib | grep -Fq "$OLD"; then
            echo "ERROR: Absolute CydiaSubstrate path remains"
            exit 1
          fi

          echo "=== Build verification completed ==="

      - name: Upload KeepAwake dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-iOS
          path: dist/KeepAwake.dylib
          if-no-files-found: error
