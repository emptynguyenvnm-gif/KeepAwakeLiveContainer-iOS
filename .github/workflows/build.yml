
name: Build KeepAwake Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Build KeepAwake
        run: |
          set -e

          make clean
          make

          mkdir -p dist

          DYLIB=$(find . -type f -name "KeepAwake.dylib" \
            -not -path "*.dSYM/*" \
            -not -path "*/dist/*" \
            | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "ERROR: KeepAwake.dylib not found"
            exit 1
          fi

          cp "$DYLIB" dist/KeepAwake.dylib

          echo "=== Original dependencies ==="
          otool -L dist/KeepAwake.dylib

          if otool -L dist/KeepAwake.dylib | grep -q "/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"; then
            install_name_tool -change \
              /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate \
              @rpath/CydiaSubstrate.framework/CydiaSubstrate \
              dist/KeepAwake.dylib
          fi

          echo "=== Final dependencies ==="
          otool -L dist/KeepAwake.dylib

          file dist/KeepAwake.dylib

          test -s dist/KeepAwake.dylib

          if ! file dist/KeepAwake.dylib | grep -q "dynamically linked shared library"; then
            echo "ERROR: Invalid dylib"
            exit 1
          fi

          if otool -L dist/KeepAwake.dylib | grep -q "/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"; then
            echo "ERROR: CydiaSubstrate path was not fixed"
            exit 1
          fi

      - name: Upload KeepAwake dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-iOS
          path: dist/KeepAwake.dylib
          if-no-files-found: error
